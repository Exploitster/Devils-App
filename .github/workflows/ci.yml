name: Application checks
on:
  push:
    branches-ignore: [staging]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run evidence:verify
      - run: npm run eval
      - run: npm run build
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Synthetic public identifiers exercise the consent boundary. Each spec
      # intercepts its provider's traffic; nothing reaches Clarity or PostHog.
      - name: Clarity consent checks
        env:
          NEXT_PUBLIC_CLARITY_PROJECT_ID: synth12345
        run: npm run test:e2e -- tests/e2e/analytics.spec.ts
      - name: PostHog consent checks
        env:
          NEXT_PUBLIC_POSTHOG_KEY: phc_synthetictestkey0123456789abcdefABCDEF
        run: npm run test:e2e -- tests/e2e/posthog.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-results
          path: test-results/
